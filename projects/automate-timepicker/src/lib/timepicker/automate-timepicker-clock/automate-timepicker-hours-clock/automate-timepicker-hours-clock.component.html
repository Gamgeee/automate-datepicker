<div #clockCircle class="clock-circle" (mousedown)="onClockFaceMouseDown($event)">
  <div class="clock-center"></div>

  <automate-timepicker-clock-hand [selectedItem]="selectedHour">
  </automate-timepicker-clock-hand>

  <button [id]="hour.id" class="clock-btn" *ngFor="let hour of hours" [style.top]="hour.top" [style.left]="hour.left"
    [class.selected]="hour.isSelected" (mouseup)="selectHour(hour)">
    {{hour.formattedHour}}
  </button>
</div>
